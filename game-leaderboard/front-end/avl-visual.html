<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVL Tree Visual | Game Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d1a;
            --surface: #13132b;
            --card: #1a1a38;
            --primary: #7c3aed;
            --primary-glow: #a78bfa;
            --accent: #06d6a0;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #e2e8f0;
            --muted: #64748b;
            --node-blue: #1d4ed8;
            --node-blue-border: #60a5fa;
            --node-green: #065f46;
            --node-green-border: #34d399;
            --node-orange: #92400e;
            --node-orange-border: #fbbf24;
            --node-red: #7f1d1d;
            --node-red-border: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* HEADER */
        header {
            background: var(--surface);
            border-bottom: 1px solid rgba(124,58,237,0.3);
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 16px;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .back-btn {
            display: flex; align-items: center; gap: 6px;
            color: var(--primary-glow); text-decoration: none; font-size: 0.85rem;
            padding: 7px 14px; border: 1px solid var(--primary); border-radius: 8px;
            transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(124,58,237,0.18); box-shadow: 0 0 14px rgba(124,58,237,0.35); }
        h1 {
            font-family: 'Orbitron', monospace; font-size: 1.3rem;
            background: linear-gradient(135deg, var(--primary-glow), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* ROTATION BOX */
        .rotation-box {
            background: var(--card);
            border: 1.5px solid rgba(245,158,11,0.45);
            border-radius: 12px;
            padding: 12px 18px;
            min-width: 210px;
            transition: border-color 0.3s;
        }
        .rotation-box.active { border-color: var(--warning); box-shadow: 0 0 18px rgba(245,158,11,0.3); }
        .rot-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 6px; }
        .rot-type { font-family: 'Orbitron', monospace; font-size: 0.88rem; color: var(--warning); font-weight: 700; }
        .rot-desc { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }

        /* CONTROL BAR */
        .control-bar {
            background: var(--surface);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 10px 28px;
            display: flex; align-items: center; gap: 10px; flex-shrink: 0;
        }
        .btn {
            display: flex; align-items: center; gap: 7px;
            padding: 9px 18px; border: none; border-radius: 8px;
            font-weight: 600; font-size: 0.88rem; cursor: pointer; transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-insert { background: linear-gradient(135deg,#059669,#06d6a0); color: white; }
        .btn-insert:hover { box-shadow: 0 0 18px rgba(6,214,160,0.4); transform: translateY(-1px); }
        .btn-delete { background: linear-gradient(135deg,#b91c1c,#ef4444); color: white; }
        .btn-delete:hover { box-shadow: 0 0 18px rgba(239,68,68,0.4); transform: translateY(-1px); }
        .btn-clear { background: rgba(255,255,255,0.07); color: var(--muted); border: 1px solid rgba(255,255,255,0.12); }
        .btn-clear:hover { background: rgba(255,255,255,0.13); }
        .legend { display: flex; gap: 14px; margin-left: auto; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: var(--muted); }
        .dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid; }

        /* TREE AREA */
        .tree-area { flex: 1; position: relative; overflow: auto; }
        #treeSvg { display: block; }
        .empty-state {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            text-align: center; color: var(--muted); pointer-events: none;
        }
        .empty-state .ei { font-size: 3.5rem; opacity: 0.25; margin-bottom: 12px; }
        .empty-state p { font-size: 1rem; }

        /* OP LOG */
        .op-log {
            position: absolute; bottom: 14px; left: 14px;
            background: rgba(13,13,26,0.9); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.07); border-radius: 10px;
            padding: 10px 14px; width: 260px; max-height: 140px; overflow-y: auto;
            font-size: 0.75rem; z-index: 10;
        }
        .op-log-title { color: var(--muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 7px; }
        .log-entry { margin-bottom: 3px; padding-bottom: 3px; border-bottom: 1px solid rgba(255,255,255,0.04); animation: fadeIn 0.3s ease; }
        .c-green { color: #34d399; } .c-red { color: #f87171; } .c-yellow { color: #fbbf24; }

        /* MODALS */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(5px);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--card); border: 1px solid rgba(124,58,237,0.35);
            border-radius: 16px; padding: 28px; width: 360px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(124,58,237,0.1);
        }
        .modal-box h3 { font-family: 'Orbitron', monospace; font-size: 1rem; color: var(--primary-glow); margin-bottom: 18px; }
        .modal-box p { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
        .modal-box input {
            width: 100%; padding: 11px 14px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            color: var(--text); font-size: 0.9rem; margin-bottom: 10px;
            font-family: 'Inter', sans-serif; transition: border-color 0.2s;
        }
        .modal-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px rgba(124,58,237,0.2); }
        .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
        .modal-actions .btn { flex: 1; justify-content: center; }
        .btn-cancel { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid rgba(255,255,255,0.1); }

        @keyframes fadeIn { from { opacity:0; transform: translateY(-3px); } to { opacity:1; transform: translateY(0); } }
        @keyframes nodePop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
        .node-pop { animation: nodePop 0.35s ease; }

        /* Balance factor badge */
        .bf-badge { font-size: 9px; fill: #94a3b8; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="index.html" class="back-btn">&#8592; Leaderboard</a>
        <h1>AVL Tree Visual</h1>
    </div>
    <div class="rotation-box" id="rotationBox">
        <div class="rot-label">Last Rotation</div>
        <div class="rot-type" id="rotType">No Rotation</div>
        <div class="rot-desc" id="rotDesc">Insert a player to begin</div>
    </div>
</header>

<div class="control-bar">
    <button class="btn btn-insert" onclick="openModal('insertModal')">&#8853; Insert Player</button>
    <button class="btn btn-delete" onclick="openModal('deleteModal')">&#128465; Delete Player</button>
    <button class="btn btn-clear" onclick="clearTree()">&#10005; Clear</button>
    <div class="legend">
        <div class="legend-item"><div class="dot" style="background:#1d4ed8;border-color:#60a5fa"></div> Normal</div>
        <div class="legend-item"><div class="dot" style="background:#065f46;border-color:#34d399"></div> New/Found</div>
        <div class="legend-item"><div class="dot" style="background:#92400e;border-color:#fbbf24"></div> Rotated</div>
    </div>
</div>

<div class="tree-area" id="treeArea">
    <div class="empty-state" id="emptyState">
        <div class="ei">&#127807;</div>
        <p>Insert a player to visualize the AVL Tree</p>
    </div>
    <svg id="treeSvg">
        <g id="edgeGroup"></g>
        <g id="nodeGroup"></g>
    </svg>
    <div class="op-log">
        <div class="op-log-title">Operation Log</div>
        <div id="logList"></div>
    </div>
</div>

<!-- Insert Modal -->
<div id="insertModal" class="modal-overlay">
    <div class="modal-box">
        <h3>&#8853; Add New Player</h3>
        <input type="text" id="newUsername" placeholder="Enter Username" />
        <input type="number" id="newScore" placeholder="Enter Score" />
        <div class="modal-actions">
            <button class="btn btn-insert" onclick="confirmInsert()">Confirm</button>
            <button class="btn btn-cancel" onclick="closeModal('insertModal')">Cancel</button>
        </div>
    </div>
</div>

<!-- Delete Modal -->
<div id="deleteModal" class="modal-overlay">
    <div class="modal-box">
        <h3>&#128465; Remove Player</h3>
        <p>Enter the exact username to remove from the leaderboard:</p>
        <input type="text" id="delUsername" placeholder="Exact Username" />
        <div class="modal-actions">
            <button class="btn btn-delete" onclick="confirmDelete()">Delete</button>
            <button class="btn btn-cancel" onclick="closeModal('deleteModal')">Cancel</button>
        </div>
    </div>
</div>

<script>
// ─────────────────────────────────────────────
// AVL TREE CORE
// ─────────────────────────────────────────────
class AVLNode {
    constructor(username, score) {
        this.username = username;
        this.score    = score;
        this.left     = null;
        this.right    = null;
        this.height   = 1;
    }
}

let root = null;
let lastRotation = { type: 'No Rotation', desc: 'No rotation performed', nodes: [] };
let highlightSet  = new Set();   // usernames to highlight (green = new node)
let rotateSet     = new Set();   // usernames involved in rotation (orange)

function H(n) { return n ? n.height : 0; }
function BF(n) { return n ? H(n.left) - H(n.right) : 0; }
function upH(n) { n.height = 1 + Math.max(H(n.left), H(n.right)); }

function rightRotate(y) {
    let x = y.left, T2 = x.right;
    x.right = y; y.left = T2;
    upH(y); upH(x);
    lastRotation = { type: 'Right Rotation', desc: `LL Case — pivot: ${y.username} → ${x.username}`, nodes: [y.username, x.username] };
    return x;
}
function leftRotate(x) {
    let y = x.right, T2 = y.left;
    y.left = x; x.right = T2;
    upH(x); upH(y);
    lastRotation = { type: 'Left Rotation', desc: `RR Case — pivot: ${x.username} → ${y.username}`, nodes: [x.username, y.username] };
    return y;
}

function insertNode(node, username, score) {
    if (!node) return new AVLNode(username, score);
    if (score < node.score)       node.left  = insertNode(node.left,  username, score);
    else                           node.right = insertNode(node.right, username, score);
    upH(node);
    let bf = BF(node);
    if (bf > 1  && score < node.left.score)  return rightRotate(node);
    if (bf < -1 && score >= node.right.score) return leftRotate(node);
    if (bf > 1  && score >= node.left.score) {
        lastRotation = { type: 'Left-Right Rotation', desc: `LR Case — at ${node.username}`, nodes: [node.username, node.left.username] };
        node.left = leftRotate(node.left); return rightRotate(node);
    }
    if (bf < -1 && score < node.right.score) {
        lastRotation = { type: 'Right-Left Rotation', desc: `RL Case — at ${node.username}`, nodes: [node.username, node.right.username] };
        node.right = rightRotate(node.right); return leftRotate(node);
    }
    return node;
}

function minNode(n) { while (n.left) n = n.left; return n; }

function deleteNode(node, username) {
    if (!node) return null;
    node.left  = deleteNode(node.left,  username);
    node.right = deleteNode(node.right, username);
    if (node.username === username) {
        if (!node.left || !node.right) return node.left || node.right;
        let succ = minNode(node.right);
        node.username = succ.username; node.score = succ.score;
        node.right = deleteNode(node.right, succ.username);
    }
    if (!node) return null;
    upH(node);
    let bf = BF(node);
    if (bf > 1  && BF(node.left) >= 0)  return rightRotate(node);
    if (bf > 1  && BF(node.left) < 0)  {
        lastRotation = { type: 'Left-Right Rotation', desc: `LR Case after delete at ${node.username}`, nodes: [node.username, node.left ? node.left.username:''] };
        node.left = leftRotate(node.left); return rightRotate(node);
    }
    if (bf < -1 && BF(node.right) <= 0) return leftRotate(node);
    if (bf < -1 && BF(node.right) > 0) {
        lastRotation = { type: 'Right-Left Rotation', desc: `RL Case after delete at ${node.username}`, nodes: [node.username, node.right ? node.right.username:''] };
        node.right = rightRotate(node.right); return leftRotate(node);
    }
    return node;
}

// ─────────────────────────────────────────────
// LAYOUT & RENDER
// ─────────────────────────────────────────────
const R       = 32;   // node radius
const LH      = 100;  // vertical spacing per level
const PADDING = 60;

function assignX(node, counter) {
    if (!node) return counter;
    counter = assignX(node.left, counter);
    node._xi = counter++;
    counter = assignX(node.right, counter);
    return counter;
}

function assignDepth(node, d) {
    if (!node) return;
    node._depth = d;
    assignDepth(node.left,  d + 1);
    assignDepth(node.right, d + 1);
}

function collectNodes(node, arr) {
    if (!node) return;
    collectNodes(node.left,  arr);
    arr.push(node);
    collectNodes(node.right, arr);
}

function renderTree() {
    const svgEl   = document.getElementById('treeSvg');
    const edgeG   = document.getElementById('edgeGroup');
    const nodeG   = document.getElementById('nodeGroup');
    const empty   = document.getElementById('emptyState');
    edgeG.innerHTML = '';
    nodeG.innerHTML = '';

    if (!root) { empty.style.display = 'block'; svgEl.setAttribute('width','100'); svgEl.setAttribute('height','100'); return; }
    empty.style.display = 'none';

    assignX(root, 0);
    assignDepth(root, 0);

    const nodes = [];
    collectNodes(root, nodes);

    const totalNodes = nodes.length;
    const treeH      = H(root);
    const svgW       = Math.max(totalNodes * (R*2 + 20) + PADDING*2, 600);
    const svgH       = Math.max(treeH * LH + PADDING*2, 200);

    svgEl.setAttribute('width',  svgW);
    svgEl.setAttribute('height', svgH);

    const xScale = (svgW - PADDING*2) / Math.max(totalNodes - 1, 1);

    function cx(node) { return PADDING + node._xi * xScale; }
    function cy(node) { return PADDING + node._depth * LH; }

    // Draw edges first
    function drawEdges(node) {
        if (!node) return;
        if (node.left) {
            const line = document.createElementNS('http://www.w3.org/2000/svg','line');
            line.setAttribute('x1', cx(node)); line.setAttribute('y1', cy(node));
            line.setAttribute('x2', cx(node.left)); line.setAttribute('y2', cy(node.left));
            line.setAttribute('stroke','rgba(255,255,255,0.13)'); line.setAttribute('stroke-width','1.8');
            edgeG.appendChild(line);
            drawEdges(node.left);
        }
        if (node.right) {
            const line = document.createElementNS('http://www.w3.org/2000/svg','line');
            line.setAttribute('x1', cx(node)); line.setAttribute('y1', cy(node));
            line.setAttribute('x2', cx(node.right)); line.setAttribute('y2', cy(node.right));
            line.setAttribute('stroke','rgba(255,255,255,0.13)'); line.setAttribute('stroke-width','1.8');
            edgeG.appendChild(line);
            drawEdges(node.right);
        }
    }
    drawEdges(root);

    // Draw nodes
    nodes.forEach(node => {
        const x = cx(node), y = cy(node);
        const isHighlight = highlightSet.has(node.username);
        const isRotate    = rotateSet.has(node.username);

        let fill   = '#1d4ed8', stroke = '#60a5fa';
        if (isRotate)    { fill = '#92400e'; stroke = '#fbbf24'; }
        if (isHighlight) { fill = '#065f46'; stroke = '#34d399'; }

        const g = document.createElementNS('http://www.w3.org/2000/svg','g');
        g.setAttribute('class','tree-node' + (isHighlight || isRotate ? ' node-pop' : ''));

        // Glow filter circle (shadow)
        const glow = document.createElementNS('http://www.w3.org/2000/svg','circle');
        glow.setAttribute('cx', x); glow.setAttribute('cy', y); glow.setAttribute('r', R+5);
        glow.setAttribute('fill', stroke); glow.setAttribute('opacity','0.12');
        g.appendChild(glow);

        const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
        circle.setAttribute('cx', x); circle.setAttribute('cy', y); circle.setAttribute('r', R);
        circle.setAttribute('fill', fill); circle.setAttribute('stroke', stroke); circle.setAttribute('stroke-width','2.5');
        g.appendChild(circle);

        // Username label
        const t1 = document.createElementNS('http://www.w3.org/2000/svg','text');
        t1.setAttribute('x', x); t1.setAttribute('y', y - 6);
        t1.setAttribute('text-anchor','middle'); t1.setAttribute('dominant-baseline','middle');
        t1.setAttribute('font-family','Inter,sans-serif'); t1.setAttribute('font-size','10');
        t1.setAttribute('font-weight','600'); t1.setAttribute('fill','#ffffff');
        t1.textContent = node.username.length > 8 ? node.username.slice(0,7)+'…' : node.username;
        g.appendChild(t1);

        // Score label
        const t2 = document.createElementNS('http://www.w3.org/2000/svg','text');
        t2.setAttribute('x', x); t2.setAttribute('y', y + 9);
        t2.setAttribute('text-anchor','middle'); t2.setAttribute('dominant-baseline','middle');
        t2.setAttribute('font-family','Inter,sans-serif'); t2.setAttribute('font-size','9');
        t2.setAttribute('fill','rgba(255,255,255,0.65)');
        t2.textContent = node.score;
        g.appendChild(t2);

        // Balance factor badge (top-right of circle)
        const bf = BF(node);
        const badge = document.createElementNS('http://www.w3.org/2000/svg','text');
        badge.setAttribute('x', x + R - 4); badge.setAttribute('y', y - R + 8);
        badge.setAttribute('text-anchor','middle'); badge.setAttribute('dominant-baseline','middle');
        badge.setAttribute('font-family','Inter,sans-serif'); badge.setAttribute('font-size','9');
        badge.setAttribute('fill', bf === 0 ? '#94a3b8' : Math.abs(bf) === 1 ? '#fbbf24' : '#f87171');
        badge.textContent = bf >= 0 ? '+'+bf : bf;
        g.appendChild(badge);

        nodeG.appendChild(g);
    });
}

// ─────────────────────────────────────────────
// ROTATION INDICATOR
// ─────────────────────────────────────────────
function updateRotationBox() {
    const box  = document.getElementById('rotationBox');
    const type = document.getElementById('rotType');
    const desc = document.getElementById('rotDesc');
    type.textContent = lastRotation.type;
    desc.textContent = lastRotation.desc;
    box.classList.add('active');
    rotateSet = new Set(lastRotation.nodes);
    setTimeout(() => { box.classList.remove('active'); rotateSet.clear(); renderTree(); }, 1800);
}

// ─────────────────────────────────────────────
// OP LOG
// ─────────────────────────────────────────────
function addLog(html) {
    const list = document.getElementById('logList');
    const div  = document.createElement('div');
    div.className = 'log-entry'; div.innerHTML = html;
    list.prepend(div);
    while (list.children.length > 20) list.removeChild(list.lastChild);
}

// ─────────────────────────────────────────────
// ACTIONS
// ─────────────────────────────────────────────
async function confirmInsert() {
    const username = document.getElementById('newUsername').value.trim();
    const score    = parseInt(document.getElementById('newScore').value);
    if (!username || isNaN(score)) return;

    // Sync with backend first
    try {
        await fetch('http://localhost:3000/api/scores', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ username, score })
        });
    } catch(e) {
        addLog(`<span class="c-red">ERROR</span> Could not reach server`);
        return;
    }

    lastRotation = { type: 'No Rotation', desc: 'Tree already balanced — no rotation needed', nodes: [] };
    root = insertNode(root, username, score);

    highlightSet = new Set([username]);
    renderTree();
    updateRotationBox();
    addLog(`<span class="c-green">INSERT</span> ${username} (${score}) — <span class="c-yellow">${lastRotation.type}</span>`);

    setTimeout(() => { highlightSet.clear(); renderTree(); }, 1500);

    document.getElementById('newUsername').value = '';
    document.getElementById('newScore').value    = '';
    closeModal('insertModal');
}

async function confirmDelete() {
    const username = document.getElementById('delUsername').value.trim();
    if (!username) return;

    // Sync with backend first
    try {
        const res = await fetch(`http://localhost:3000/api/scores/${username}`, { method: 'DELETE' });
        if (!res.ok) {
            addLog(`<span class="c-red">ERROR</span> Player not found on server`);
            document.getElementById('delUsername').value = '';
            closeModal('deleteModal');
            return;
        }
    } catch(e) {
        addLog(`<span class="c-red">ERROR</span> Could not reach server`);
        return;
    }

    lastRotation = { type: 'No Rotation', desc: 'Tree already balanced — no rotation needed', nodes: [] };
    root = deleteNode(root, username);

    highlightSet.clear();
    renderTree();
    updateRotationBox();
    addLog(`<span class="c-red">DELETE</span> ${username} — <span class="c-yellow">${lastRotation.type}</span>`);

    document.getElementById('delUsername').value = '';
    closeModal('deleteModal');
}

function clearTree() {
    root = null;
    highlightSet.clear(); rotateSet.clear();
    lastRotation = { type: 'No Rotation', desc: 'Tree cleared', nodes: [] };
    document.getElementById('rotType').textContent = 'No Rotation';
    document.getElementById('rotDesc').textContent = 'Tree cleared';
    renderTree();
    addLog('<span class="c-red">CLEAR</span> All nodes removed');
}

// ─────────────────────────────────────────────
// MODAL HELPERS
// ─────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

// ─────────────────────────────────────────────
// LOAD INITIAL DATA FROM BACKEND
// ─────────────────────────────────────────────
async function loadFromBackend() {
    try {
        const res = await fetch('http://localhost:3000/api/scores');
        const players = await res.json();
        // Build the AVL tree from the existing data
        // Insert in random order so the tree self-balances naturally
        const shuffled = players.slice().sort(() => Math.random() - 0.5);
        shuffled.forEach(p => {
            root = insertNode(root, p.username, p.score);
        });
        if (players.length > 0) {
            addLog(`<span class="c-yellow">LOADED</span> ${players.length} player(s) from server`);
        }
    } catch(e) {
        addLog(`<span class="c-red">WARN</span> Server offline — starting empty`);
    }
    renderTree();
}

loadFromBackend();
</script>
</body>
</html>
