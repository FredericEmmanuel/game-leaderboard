<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Leaderboard</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="modal.css">
</head>

<body>

  <!-- TITLE -->
  <h1 class="title">
    Game Leaderboard
  </h1>

  <!-- TOOLBAR -->
  <section class="toolbar">

    <!-- SEARCH -->
    <input
      type="text"
      id="search-input"
      placeholder="Search Player Name"
    >

    <!-- INSERT -->
    <button class="insert-btn">
      + Insert Player
    </button>

    <!-- DELETE -->
    <button class="delete-btn">
      Delete Player
    </button>

    <!-- FILTER -->
    <button class="filter-btn">
      Filter
    </button>

  </section>

  <!-- TABLE -->
  <section class="table-container">

    <table>

      <thead>
        <tr>
          <th>User ID</th>
          <th>Username</th>
          <th>Highscore</th>
        </tr>
      </thead>

      <tbody id="leaderboard-body">

        

      </tbody>

    </table>

  </section>

  <!-- PAGINATION -->
  <section class="pagination">

    <button>
      ←
    </button>

    <button>
      →
    </button>

  </section>

  <script src="../js/app.js"></script>
  <!-- INSERT MODAL -->
<div class="modal hidden" id="insert-modal">

  <div class="modal-content">

    <h2>Add Player</h2>

    <input
      type="number"
      id="user-id-input"
      placeholder="User ID"
    >

    <input
      type="text"
      id="username-input"
      placeholder="Username"
    >

    <input
      type="number"
      id="highscore-input"
      placeholder="Highscore"
    >

    <button id="save-player-btn">
      Save Player
    </button>

  </div>

</div>
<script src="../js/modal.js"></script>

</body>
</html>
